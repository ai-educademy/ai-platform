name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Init submodules
        run: |
          git config --global url."https://x-access-token:${{ secrets.SUBMODULE_PAT }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --force content
          git submodule update --init --force content-pro || echo "⚠️ content-pro not accessible — building with free content only"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Runs after build because `prebuild` is what merges the private paid
      # content into content/programs/. Before that merge the catalogue would
      # look half empty and the check would be meaningless.
      - name: Validate catalogue integrity
        run: npm run validate:catalogue

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Init submodules
        run: |
          git config --global url."https://x-access-token:${{ secrets.SUBMODULE_PAT }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --force content
          git submodule update --init --force content-pro || echo "⚠️ content-pro not accessible — building with free content only"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build

      - name: Start server and smoke test
        run: |
          npm start -- -p 3000 &
          SERVER_PID=$!

          # Wait for server to be ready (max 30s)
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/robots.txt | grep -q "200"; then
              echo "✅ Server ready after ${i}s"
              break
            fi
            sleep 1
          done

          echo "🔍 Running smoke tests..."
          FAILED=0

          # Test critical pages
          for path in "/" "/en" "/en/programs" "/en/lab" "/en/about" "/robots.txt" "/sitemap.xml" "/manifest.webmanifest"; do
            STATUS=$(curl -sL -o /dev/null -w "%{http_code}" "http://localhost:3000${path}")
            if [ "$STATUS" = "200" ]; then
              echo "  ✅ ${path} → ${STATUS}"
            else
              echo "  ❌ ${path} → ${STATUS}"
              FAILED=1
            fi
          done

          # Test non-English locales
          for locale in fr nl hi te; do
            STATUS=$(curl -sL -o /dev/null -w "%{http_code}" "http://localhost:3000/${locale}")
            if [ "$STATUS" = "200" ]; then
              echo "  ✅ /${locale} → ${STATUS}"
            else
              echo "  ❌ /${locale} → ${STATUS}"
              FAILED=1
            fi
          done

          # Verify key SEO elements exist in HTML
          HTML=$(curl -sL http://localhost:3000/en)
          echo "$HTML" | grep -q "application/ld+json" && echo "  ✅ JSON-LD present" || { echo "  ❌ JSON-LD missing"; FAILED=1; }
          echo "$HTML" | grep -q "og:title" && echo "  ✅ OG tags present" || { echo "  ❌ OG tags missing"; FAILED=1; }

          kill $SERVER_PID 2>/dev/null

          if [ "$FAILED" = "1" ]; then
            echo ""
            echo "❌ Smoke tests FAILED — this build would break production!"
            exit 1
          fi

          echo ""
          echo "✅ All smoke tests passed — safe to deploy"

  e2e-tests:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Init submodules
        run: |
          git config --global url."https://x-access-token:${{ secrets.SUBMODULE_PAT }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --force content
          git submodule update --init --force content-pro || echo "⚠️ content-pro not accessible — building with free content only"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run Playwright tests
        run: |
          # Ephemeral, throwaway value so NextAuth can initialise and return a
          # proper 401 on unauthenticated routes instead of crashing with a 500.
          # Generated in-process: never written to disk or $GITHUB_ENV.
          export AUTH_SECRET="$(openssl rand -base64 32)"
          npx playwright test --project=chromium
        env:
          BASE_URL: http://localhost:3000
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

