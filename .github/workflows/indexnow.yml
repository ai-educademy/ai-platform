name: IndexNow

# Search Console access is not available, so IndexNow is the push channel that
# tells Bing, Yandex and other participating engines about new or changed pages.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      # Submodule bumps change the gitlink path itself, not files beneath it.
      - "content"
      - "content-pro"
      - "messages/**"
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/indexnow.mjs
            public
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Wait for the production deploy to pick up this commit
        if: github.event_name == 'push'
        run: sleep 300
      - name: Submit sitemap URLs
        run: node scripts/indexnow.mjs --sitemap https://aieducademy.org/sitemap.xml
