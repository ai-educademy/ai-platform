name: Update Content

on:
  repository_dispatch:
    types: [content-update]
  # Also run when ai-courses is updated (can be triggered manually)
  workflow_dispatch:

concurrency:
  group: content-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Init submodules
        run: |
          git config --global url."https://x-access-token:${{ secrets.SUBMODULE_PAT }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --force content
          git submodule update --init --force content-pro || echo "⚠️ content-pro not accessible"

      - name: Update ai-courses submodule
        run: |
          echo "Updating content submodule to latest..."
          git submodule update --init --remote content
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No content changes detected"
          else
            git add content
            git commit -m "chore: update ai-courses content to latest"
            git push
          fi
